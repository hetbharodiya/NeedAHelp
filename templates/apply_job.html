{% extends "base.html" %}

{% block content %}

<h2 class="text-2xl font-bold mb-4">
    Apply for: {{ job.title }}
</h2>

<form method="POST" class="max-w-md bg-white p-6 rounded-xl shadow">
    {% csrf_token %}

    <input
        type="text"
        name="name"
        class="w-full mb-4 p-3 border rounded"
        placeholder="Your Name"
        required
    >

    <input
        type="text"
        name="phone"
        class="w-full mb-4 p-3 border rounded"
        placeholder="Phone Number"
        required
    >

    <textarea
        name="message"
        rows="3"
        class="w-full mb-4 p-3 border rounded"
        placeholder="Message (optional)"
    ></textarea>

    <button
        type="submit"
        class="bg-black text-white px-6 py-3 rounded-lg w-full hover:bg-gray-800"
    >
        Submit Application
    </button>
</form>

<a href="{% url 'job_detail' job.id %}" class="inline-block mt-4 text-blue-600">
    ← Back to Job
</a>

{% endblock %}
