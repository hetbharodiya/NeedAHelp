<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NeedAHelp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 overflow-x-hidden">

<!-- Header -->
<header class="bg-white shadow-sm h-20">
    <div class="w-full px-8 py-4 flex items-center justify-between">
        <a href="/" class="text-xl font-extrabold">
            NeedAHelp
        </a>

        <nav class="flex gap-6 text-sm">
            {% if user.is_authenticated %}

                {% if user.profile.role == "job_poster" %}
                    <a href="{% url 'post_job' %}">Post Job</a>
                    <a href="{% url 'my_jobs' %}">My Jobs</a>
                {% endif %}

                {% if user.profile.role == "job_seeker" %}
                    <a href="{% url 'browse_jobs' %}">Find Jobs</a>
                    <a href="{% url 'my_applications' %}">My Applications</a>
                {% endif %}

                <span class="font-semibold">Hi, {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="text-red-600">Logout</a>

            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </div>
</header>

<!-- Page Content (EDGE TO EDGE) -->
<main class="w-full m-0 p-0">
    {% block content %}{% endblock %}
</main>

</body>
</html>
