<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NeedAHelp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

<!-- Header -->
<header class="bg-white shadow-sm">
    <div class="max-w-screen-md mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="text-xl font-extrabold">
            NeedAHelp
        </a>

        <nav class="flex items-center gap-4 text-sm">

            <!-- Common links -->
            <a href="/jobs/" class="text-gray-700 hover:text-black">Find Jobs</a>
            <a href="/post-job/" class="text-gray-700 hover:text-black">Post Job</a>

            <!-- Auth links -->
            {% if user.is_authenticated %}
                <span class="text-gray-600">
                    Hi, <strong>{{ user.username }}</strong>
                </span>
                <a href="{% url 'logout' %}"
                   class="text-red-600 hover:text-red-700 font-medium">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}"
                   class="text-blue-600 hover:text-blue-700 font-medium">
                    Login
                </a>
                <a href="{% url 'register' %}"
                   class="text-blue-600 hover:text-blue-700 font-medium">
                    Register
                </a>
            {% endif %}

        </nav>
    </div>
</header>

<!-- Page container -->
<main class="max-w-screen-md mx-auto px-4 py-4">

    <!-- Messages -->
    {% if messages %}
        <div class="space-y-3 mb-4">
            {% for message in messages %}
                <div class="p-4 rounded-lg bg-green-100 text-green-800 text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

</main>
