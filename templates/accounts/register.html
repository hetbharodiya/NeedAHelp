{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
    <h2 class="text-2xl font-bold mb-4 text-center">Create Account</h2>

    <form method="post"
          action="{% url 'register' %}"
          enctype="multipart/form-data"
          class="space-y-4">

        {% csrf_token %}

        <!-- USERNAME -->
        <div>
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
                class="w-full border px-3 py-2 rounded"
            >
        </div>

        <!-- EMAIL -->
        <div>
            <input
                type="email"
                name="email"
                placeholder="Email"
                required
                class="w-full border px-3 py-2 rounded"
            >
        </div>

        <!-- PASSWORD -->
        <div>
            <input
                type="password"
                name="password1"
                placeholder="Password"
                required
                class="w-full border px-3 py-2 rounded"
            >
        </div>

        <div>
            <input
                type="password"
                name="password2"
                placeholder="Confirm Password"
                required
                class="w-full border px-3 py-2 rounded"
            >
        </div>

        <!-- ROLE SELECTION -->
        <div>
            <p class="font-semibold mb-2">I want to:</p>

            <label class="flex items-center mb-2">
                <input type="radio" name="role" value="job_poster" required>
                <span class="ml-2">Post Jobs</span>
            </label>

            <label class="flex items-center">
                <input type="radio" name="role" value="job_seeker">
                <span class="ml-2">Find Work</span>
            </label>
        </div>

        <!-- 🔐 KYC DOCUMENT SECTION -->
        <hr>
        <h3 class="font-semibold">Identity Verification (Mandatory)</h3>

        <!-- DOCUMENT TYPE -->
        <div>
            <select
                name="document_type"
                required
                class="w-full border px-3 py-2 rounded"
            >
                <option value="">Select Document Type</option>
                <option value="aadhaar">Aadhaar Card</option>
                <option value="voter">Voter ID</option>
                <option value="driving">Driving License</option>
            </select>
        </div>

        <!-- DOCUMENT FILE -->
        <div>
            <input
                type="file"
                name="document_file"
                accept=".jpg,.jpeg,.png,.pdf"
                required
                class="w-full border px-3 py-2 rounded"
            >
            <p class="text-xs text-gray-500 mt-1">
                Upload clear photo or PDF of your document
            </p>
        </div>

        <!-- SUBMIT -->
        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
        >
            Register
        </button>
    </form>
</div>
{% endblock %}
